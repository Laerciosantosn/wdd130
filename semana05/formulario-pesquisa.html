<!DOCTYPE html>
<html lang="ept-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Criando Formulario</title>
    <meta name="description" content="Formulario HTML">
    <meta name="author" content="Laercio Santos">
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Link 1</a></li>
                <li><a href="#">Link 2</a></li>
                <li><a href="#">Link 3</a></li>
                <li><a href="#">Link 4</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>WDD 130 | Formulário HTML - Pesquisa de Usuário</h1>
        <form action="">
            <fieldset>
                <legend>Informações de Contato</legend>
                <div class="item-formulario coluna2">
                    <label for="nomecompleto">Nome Completo:
                    </label>
                    <input type="text" id="nome-completo" name="nome-completo" required>
                </div>
                <div class="item-formulario coluna2">
                    <label for="emaildousuario">E-mail:
                    </label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Perguntas</legend>

                <div class="item-formulario coluna1">
                    <label for="navegadorfavorito">Qual é o seu navegador favorito?
                    </label>
                    <select id="navegador" name="navegador">
                        <option value="brave">Brave</option>
                        <option value="chrome">Chrome</option>
                        <option value="explore">Explore</option>
                        <option value="fire-fox">Fire Fox</option>
                        <option value="opera">Opera</option>
                        <option value="safari">Safari</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="item-formulario coluna1">
                    <label for="pet">Você tem um bichinho de estimação em casa?
                    </label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="item-formulario">
                    <label for="feedback">Liste os lugares onde você morou.
                    </label>
                    <textarea name="feedback" id="feedback" rows="4"
                      placeholder="Stillwater Flórida, Amsterdã Holanda, Tiburktu Mali"></textarea>
                </div>
            </fieldset>

            <button type="submit">Enviar Pesquisa</button>
        </form>
    </main>

    <footer>

    </footer>

</body>

</html>
