<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Splash Rafting em Corredeiras.</title>
    <meta name="description"
      content="Entre em Contato Conosco, Para Elogios, Sugestões ou Reclamações, Estamos Aqui Para lhe Atender da Melhor Forma.">
    <meta name="author" content="Laércio Santos">
    <link rel="stylesheet" href="./estilos/rafting.css">
</head>

<body>

    <header>
        <img src="./imagens/logo-z-splash.png" alt="Splash Rafting em Corredeiras">
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <div class="containe">
            <article class="contato">
                <h1>Fale Conosco Splash Rafting em Corredeiras</h1>

                <div>
                    <p>123, Rua do Rio Pardo</p>
                    <p>Petrolina, PE</p>
                    <p>+55 81 99999,9999</p>
                    <p>info@Corredeiras.com</p>
                </div>
            </article>

            <section class="forme-conteiner">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d62984.769640560065!2d-40.55131793427342!3d-9.373196072977665!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x7737a8452b2d649%3A0xa0e71dc0c94e0aed!2sPetrolina%2C%20PE!5e0!3m2!1spt-BR!2sbr!4v1785081062141!5m2!1spt-BR!2sbr"
                  width="550" height="561" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>

                <form action="">
                    <!-- <div class="item-formulario coluna1"> -->
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email">

                    <label for="proposito-mensagem">
                        <input type="radio" id="proposito-mensagem" name="proposito-mensagem"
                          value="Dúvida Geral">
                        Dúvida Geral
                    </label>
                    <label>
                        <input type="radio" id="proposito-mensagem" name="proposito-mensagem"
                          value="Dúvida Geral">
                        Pergunta Sobre Reserva
                    </label>
                    <label>
                        <input type="radio" id="proposito-mensagem" name="proposito-mensagem"
                          value="Dúvida Geral">
                        Sugestão de Site
                    </label>
                    <label for="mensagem">Mensagem:</label>
                    <textarea name="mensagem" id="mensagem" rows="6"></textarea>
                    <label for="newsletter">Por favor, me inscreva na newsletter mensal</label>
                    <input type="checkbox" name="newsletter" id="newsletter">

                    <button type="submit">Entrar em Contato</button>
                </form>

            </section>

            <section class="funcionarios">
                <h2>Estamos Aqui para Serví-lo</h2>
                <figure>
                    <img src="./imagens/john-jones.jpg" alt="John Jones">
                    <figcaption>Comercial</figcaption>
                </figure>
                <figure>
                    <img src="./imagens/ariel-araujo.jpg" alt="Arial Araujo">
                    <figcaption>Vendas</figcaption>
                </figure>
                <figure>
                    <img src="imagens/aline-costa.jpg" alt="Aline Costa">
                    <figcaption>Financeiro</figcaption>
                </figure>
                <figure>
                    <img src="imagens/vivian-fernandes.jpg" alt="Vivian Fernandes">
                    <figcaption>Suporte</figcaption>
                </figure>

            </section>
        </div>
    </main>

    <footer>
        <p>
            &copy;2026 🏅 Laércio Santos 🏅 São Paulo, Brasil - Splash Rafting em Corredeiras
        </p>
        <nav class="redes-sociais">
            <a href="https://facebook.com">
                <img src="./imagens/facebook.png" alt="Icone do Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="./imagens/linkedin.png" alt="Icone do Linkedin">
            </a>
            <a href="https://instagram.com">
                <img src="./imagens/instagram.png" alt="Ícone do Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
